name: devcontainer

services:
  dev:
    image: ${IMAGE:-ghcr.io/alpamayo-solutions/devcontainer:latest}
    container_name: ${CONTAINER_NAME:-devcontainer}
    hostname: ${CONTAINER_NAME:-devcontainer}
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      - "${WORK_DIR}:/home/dev/work"

      - type: bind
        source: ${AUTHORIZED_KEYS_FILE:-./authorized_keys}
        target: /etc/host-keys/authorized_keys
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ${GITCONFIG_FILE:-${HOME}/.gitconfig}
        target: /etc/host-keys/gitconfig
        read_only: true
        bind:
          create_host_path: false

      - dev_local:/home/dev/.local
      - dev_npm:/home/dev/.npm-global
      - dev_cache:/home/dev/.cache
      - dev_config:/home/dev/.config
      - dev_ssh:/home/dev/.ssh
      - dev_host_keys:/etc/ssh-host-keys
    environment:
      TZ: "${TZ:-Europe/Zurich}"
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN:-}"

volumes:
  dev_local:
  dev_npm:
  dev_cache:
  dev_config:
  dev_ssh:
  dev_host_keys:
